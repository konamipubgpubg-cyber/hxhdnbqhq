name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/hastyar/recentbutton
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HastyarRecentButton"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hastyar.recentbutton"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.hastyar.recentbutton"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Hastyar Recent</string>
              <string name="accessibility_description">دوگمەی ڕیسنت بۆ هەستیار</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="false"
                  android:label="Hastyar Recent"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".RecentService"
                      android:exported="true"
                      android:label="Hastyar Recent"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/hastyar/recentbutton/MainActivity.kt <<'EOF'
          package com.hastyar.recentbutton

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(40, 60, 40, 60)
                  }

                  val title = TextView(this).apply {
                      text = "Hastyar Recent 📱\n\n" +
                             "دوگمەی ڕیسنت لەسەر یارییەکە دەرخە"
                      textSize = 20f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }

                  layout.addView(title)

                  val overlayButton = Button(this).apply {
                      text = "١. مۆڵەتی Floating Button"
                      setOnClickListener {

                          if (!Settings.canDrawOverlays(this@MainActivity)) {

                              val intent = Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )

                              startActivity(intent)
                          }
                      }
                  }

                  layout.addView(overlayButton)

                  val accessibilityButton = Button(this).apply {
                      text = "٢. چالاککردنی Accessibility"
                      setOnClickListener {

                          startActivity(
                              Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          )
                      }
                  }

                  layout.addView(accessibilityButton)

                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/hastyar/recentbutton/RecentService.kt <<'EOF'
          package com.hastyar.recentbutton

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.Toast

          class RecentService : AccessibilityService() {

              private lateinit var windowManager: WindowManager
              private var button: TextView? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()

                  windowManager =
                      getSystemService(WINDOW_SERVICE) as WindowManager

                  createFloatingButton()
              }

              private fun createFloatingButton() {

                  val recentButton = TextView(this).apply {

                      text = "📱"
                      textSize = 24f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)

                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#DD202124"))
                          setStroke(2, Color.WHITE)
                      }

                      setOnClickListener {

                          /*
                           * Android Accessibility API
                           * opens the Recent Apps screen.
                           */
                          performGlobalAction(
                              GLOBAL_ACTION_RECENTS
                          )
                      }
                  }

                  button = recentButton

                  val params = WindowManager.LayoutParams(
                      70,
                      70,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,

                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,

                      PixelFormat.TRANSLUCENT
                  ).apply {

                      gravity = Gravity.TOP or Gravity.END

                      x = 25
                      y = 350
                  }

                  /*
                   * Dragging support
                   */
                  recentButton.setOnTouchListener(
                      object : View.OnTouchListener {

                          private var startX = 0
                          private var startY = 0

                          private var touchX = 0f
                          private var touchY = 0f

                          private var moved = false

                          override fun onTouch(
                              view: View,
                              event: MotionEvent
                          ): Boolean {

                              when (event.action) {

                                  MotionEvent.ACTION_DOWN -> {

                                      startX = params.x
                                      startY = params.y

                                      touchX = event.rawX
                                      touchY = event.rawY

                                      moved = false

                                      return false
                                  }

                                  MotionEvent.ACTION_MOVE -> {

                                      val dx =
                                          (event.rawX - touchX).toInt()

                                      val dy =
                                          (event.rawY - touchY).toInt()

                                      if (
                                          kotlin.math.abs(dx) > 10 ||
                                          kotlin.math.abs(dy) > 10
                                      ) {

                                          moved = true

                                          params.x =
                                              startX - dx

                                          params.y =
                                              startY + dy

                                          windowManager
                                              .updateViewLayout(
                                                  recentButton,
                                                  params
                                              )

                                          return true
                                      }
                                  }

                                  MotionEvent.ACTION_UP -> {

                                      if (!moved) {

                                          performGlobalAction(
                                              GLOBAL_ACTION_RECENTS
                                          )

                                          return true
                                      }
                                  }
                              }

                              return false
                          }
                      }
                  )

                  windowManager.addView(
                      recentButton,
                      params
                  )
              }

              override fun onAccessibilityEvent(
                  event: android.view.accessibility.AccessibilityEvent?
              ) {
                  // Nothing needed.
              }

              override fun onInterrupt() {
                  // Nothing needed.
              }

              override fun onDestroy() {

                  button?.let {

                      try {
                          windowManager.removeView(it)
                      } catch (_: Exception) {
                      }

                  }

                  button = null

                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hastyar-Recent-APK
          path: app/build/outputs/apk/debug/app-debug.apk
